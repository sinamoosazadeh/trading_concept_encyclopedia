name: Validate encyclopedia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Build metadata report
        run: python scripts/build_report.py
      - name: Ensure report is generated
        run: test -s reports/registry_report.json
